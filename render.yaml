services:
  # ==============================================================================
  # BACKEND SERVICE (FastAPI Python Application)
  # ==============================================================================
  - type: web
    name: docshield-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: DOCS SHIELD - Digital Evidence Command Center
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: API_V1_STR
        value: /api/v1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: MALWARE_SCAN_REQUIRED
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: BACKEND_CORS_ORIGINS
        value: https://docshield-frontend.onrender.com,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: docshield-db
          property: connectionString

  # ==============================================================================
  # FRONTEND SERVICE (Next.js 14 Web Application)
  # ==============================================================================
  - type: web
    name: docshield-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.16.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: docshield-backend
          envVarKey: RENDER_EXTERNAL_URL
          transform: "%s/api/v1"

# ==============================================================================
# MANAGED POSTGRESQL DATABASE
# ==============================================================================
databases:
  - name: docshield-db
    plan: free
    region: oregon
    databaseName: docshield
    user: docshield_user
